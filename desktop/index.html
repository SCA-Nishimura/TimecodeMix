<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimecodeMix</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <h1>TimecodeMix <small>Desktop</small></h1>
        <p class="subtitle">映像・音声にLTCタイムコードを合成する</p>
      </header>

      <p id="env-status" class="env-status">環境を確認中...</p>

      <section id="dropzone" class="dropzone">
        <p class="dropzone-title">映像ファイルをドロップ</p>
        <p class="dropzone-hint">MP4 / MOV に対応</p>
        <button id="btn-select" type="button" class="btn">ファイルを選択</button>
      </section>

      <section id="result" class="panel hidden">
        <h2>解析結果</h2>
        <dl id="meta"></dl>
        <p id="recommendation" class="recommendation"></p>
        <div id="warnings"></div>
      </section>
    </main>
  </body>
</html>
